<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Panel · GPH</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="top"><a class="brand" href="/">GIBRAN<span> PANEL HOSTING</span></a><nav><a href="/dashboard.html">Dashboard</a><a href="/panel-saya.html">Panel Saya</a></nav></header><main class="form-wrap wide"><section class="card form-card"><div class="eyebrow">PROVISIONING REQUEST</div><h1>Create Panel</h1><p>Permintaan akan dikirim ke owner Telegram dan baru diproses setelah disetujui.</p><form id="createForm"><div class="form-grid"><label>Username panel<input name="username" pattern="[a-z0-9_]{3,20}" minlength="3" maxlength="20" required placeholder="gibran01"></label><label>Gmail aktif<input name="email" type="email" required placeholder="nama@example.com"></label><label>RAM<select name="ramGb" id="ram" required></select></label><label>CPU<select name="cpu" id="cpu" required></select></label><label>Disk<select name="diskGb" id="disk" required></select></label></div><button class="button primary full" id="submitBtn">CREATE PANEL →</button></form><div id="message" class="message"></div><div class="progress hidden" id="progress"><span></span></div></section></main><script src="/js/create-panel.js"></script></body></html>
